<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Biru Tua ke Biru Laut -->
    <linearGradient id="sky-ocean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071739" />
      <stop offset="40%" stop-color="#0c2556" />
      <stop offset="80%" stop-color="#0f3b7a" />
      <stop offset="100%" stop-color="#031633" />
    </linearGradient>

    <!-- Wave 1 Gradient (Biru Muda Transparan) -->
    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.35" />
    </linearGradient>

    <!-- Wave 2 Gradient (Biru Muda Terang) -->
    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4" />
    </linearGradient>

    <!-- Wave 3 Gradient (Aksen Cyan Lembut) -->
    <linearGradient id="wave-grad-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.5" />
    </linearGradient>

    <!-- Title Gradient (Putih ke Biru Muda) -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- Subtle Soft Glow -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="card-clip">
      <rect x="0" y="0" width="960" height="220" rx="20" />
    </clipPath>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: 8px;
      fill: url(#title-grad);
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 15px;
      letter-spacing: 2.5px;
      fill: #7dd3fc;
    }

    /* Animasi Bergelombang Mengalir (Wave Animation) */
    @keyframes waveFlow1 {
      0% { transform: translateX(0); }
      50% { transform: translateX(-60px); }
      100% { transform: translateX(0); }
    }
    @keyframes waveFlow2 {
      0% { transform: translateX(0); }
      50% { transform: translateX(70px); }
      100% { transform: translateX(0); }
    }
    @keyframes waveFlow3 {
      0% { transform: translateX(0); }
      50% { transform: translateX(-40px); }
      100% { transform: translateX(0); }
    }

    .wave-back {
      animation: waveFlow1 9s ease-in-out infinite;
    }
    .wave-mid {
      animation: waveFlow2 7s ease-in-out infinite;
    }
    .wave-front {
      animation: waveFlow3 11s ease-in-out infinite;
    }
  </style>

  <g clip-path="url(#card-clip)">
    <!-- Base Background -->
    <rect x="0" y="0" width="960" height="220" fill="url(#sky-ocean)" />

    <!-- Ambient Light Accent (Biru Muda Halus) -->
    <circle cx="480" cy="80" r="180" fill="#0284c7" opacity="0.25" filter="url(#soft-glow)" />

    <!-- Gelombang 1 (Lapisan Belakang) -->
    <path class="wave-back"
          d="M -100 130 C 120 100, 320 180, 560 140 C 780 105, 960 170, 1140 135 L 1140 230 L -100 230 Z"
          fill="url(#wave-grad-1)" />

    <!-- Gelombang 2 (Lapisan Tengah) -->
    <path class="wave-mid"
          d="M -120 155 C 80 185, 360 120, 600 160 C 820 195, 1000 135, 1160 165 L 1160 230 L -120 230 Z"
          fill="url(#wave-grad-2)" />

    <!-- Gelombang 3 (Lapisan Depan Berkilau) -->
    <path class="wave-front"
          d="M -80 180 C 140 160, 360 205, 580 175 C 800 150, 1000 195, 1120 175 L 1120 230 L -80 230 Z"
          fill="url(#wave-grad-3)" />

    <!-- Teks Judul & Keterangan (Simple & Elegant) -->
    <g transform="translate(480, 85)" text-anchor="middle">
      <text x="0" y="0" class="title-text" filter="url(#soft-glow)">PRESENSIKITA</text>
      <text x="0" y="32" class="sub-text">SISTEM PRESENSI &amp; JURNAL DIGITAL SMKN 1 BOYOLANGU</text>
    </g>

    <!-- Border Halus -->
    <rect x="1" y="1" width="958" height="218" rx="19" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />
  </g>
</svg>
