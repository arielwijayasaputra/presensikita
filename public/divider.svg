<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 16" width="100%" height="16">
  <defs>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#0284c7" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="75%" stop-color="#0284c7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <line x1="20" y1="8" x2="940" y2="8" stroke="url(#line-grad)" stroke-width="1.8" filter="url(#glow)"/>
  <circle cx="480" cy="8" r="4" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="480" cy="8" r="2" fill="#ffffff"/>
</svg>
